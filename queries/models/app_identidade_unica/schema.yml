version: 2
models :
  - name: cadastros
    description: Tabela unificada de cpfs dos cadastrados no CADUNICO
    columns:
      - name: cpf
        description: CPF da Pessoa, formato NNNNNNNNNNN
      - name: id_membro_familia
        description: Número do membro da Família
      - name: id_familia
        description: Código Familiar
      - name: data_particao
        description: Data do particionamento dos dados
      - name: dados
        description: dados primarios da pessoa
      - name: dados.cpf_valido_indicador
        description: Indicador de CPF válido
      - name: dados.nome
        description: Nome da pessoa
      - name: dados.raca_cor
        description: Cor ou raça da pessoa
      - name: dados.sexo
        description: Sexo da pessoa
      - name: dados.municipio_nascimento
        description: Municipio de nascimento
      - name: dados.sigla_uf_municipio_nascimento
        description: Estado do municipio de nascimento
      - name: dados.estado_cadastral
        description: Estado cadastral da família
      - name: dados.parentesco_responsavel_familia
        description: Relaçao de parentesco com o representante familiar
      - name: dados.data_nascimento
        description: Data de nascimento
      - name: dados.data_ultima_atualizacao
        description: Data da ultima atualização do cadastro
      - name: dados.data_cadastro
        description: Data de última atualização dos dados sociais da pessoa
