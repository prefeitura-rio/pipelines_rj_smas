        description: Valor original da renda média mensal da família, formato NNNNNNNNN
      - name: renda.renda_outras_rendas
        description: Valor original de outras rendas da família.
      - name: renda.renda_emprego_ultimo_mes
        description: Valor original da renda de emprego no último mês.
      - name: renda.renda_aposentadoria
        description: Valor original da renda de aposentadoria.
      - name: renda.renda_bruta_12_meses
        description: Valor original da renda bruta nos últimos 12 meses.
      - name: renda.renda_doacao
        description: Valor original de rendas provenientes de doações.
      - name: renda.renda_pensao_alimenticia
        description: Valor original de pensão alimentícia recebida.
      - name: renda.renda_seguro_desemprego
        description: Valor original de seguro-desemprego recebido.
