        description: Despesa original com água e esgoto.
      - name: domicilio.despesa_alimentacao
        description: Despesa original com alimentação.
      - name: domicilio.despesa_aluguel
        description: Despesa original com aluguel.
      - name: domicilio.despesa_energia
        description: Despesa original com energia elétrica.
      - name: domicilio.despesa_gas
        description: Despesa original com gás.
      - name: domicilio.despesa_transporte
        description: Despesa original com transporte.
      - name: membros
        description: infomações sobre os membros da família
      - name: membros.cpf
        description: CPF do membro da família
      - name: membros.id_membro_familia
        description: Identificação do membro da família
      - name: membros.nome
        description: Nome do membro da família
      - name: membros.parentesco_responsavel_familia
        description: Relação de parentesco com o responsável familiar
      - name: cpf_particao
        description: CPF utilizado para o particionamento de dados