        description: Indica se a pessoa esteve envolvida em trabalho infantil
      - name: dados.numeros_membros_familia
        description: Número total de membros da família
      - name: deficiencia
        description: informaçoes sobre deficiencia
      - name: deficiencia.tem_deficiencia
        description: Indicador se a pessoa tem algum tipo de deficiência
